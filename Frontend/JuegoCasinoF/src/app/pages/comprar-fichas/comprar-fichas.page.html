<ion-content [fullscreen]="true">
  <main class="purchase-container">

    <header class="purchase-header">
      <div>
        <span class="brand">CASINO ROYAL</span>
        <p>ROYAL CLUB</p>
      </div>

      <ion-button
        fill="outline"
        color="warning"
        routerLink="/home">
        Volver al casino
      </ion-button>
    </header>

    <section class="purchase-content">
      <span class="eyebrow">TU EXPERIENCIA ROYAL</span>
      <h1>Compra de fichas</h1>
      <p class="description">
        Prepárate para disfrutar tus partidas de Blackjack y Ruleta.
      </p>

      <div class="coming-soon">
        <span class="chip-icon">💰</span>
        <h2>Próximamente</h2>
        <p>
          Aquí podrás consultar los paquetes de fichas disponibles
          y realizar tus compras de forma segura.
        </p>
      </div>

      <ion-button
        expand="block"
        color="warning"
        routerLink="/home">
        Regresar al inicio
      </ion-button>
    </section>

  </main>
</ion-content>
