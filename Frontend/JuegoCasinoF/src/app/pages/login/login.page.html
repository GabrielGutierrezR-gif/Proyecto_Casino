
<ion-content [fullscreen]="true">

  <div class="login-container">

    <div class="login-header">
      <h1>CASINO</h1>
      <p>La suerte está de tu lado</p>
    </div>

    <div class="login-card">

      <h2>Iniciar sesión</h2>

      <p class="subtitle">
        Ingresa a tu cuenta para continuar
      </p>

      <form (ngSubmit)="iniciarSesion()">

        <!-- Correo electrónico -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="person-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="correo"
            type="email"
            placeholder="Correo electrónico"
            autocomplete="email"
            [(ngModel)]="correo"
            required>
          </ion-input>
        </ion-item>

        <!-- Contraseña -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="lock-closed-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            [(ngModel)]="password"
            required>
          </ion-input>
        </ion-item>

        <!-- Mensaje de respuesta -->
        @if (mensaje) {
          <p [style.color]="esError ? '#ff7070' : '#f5c451'">
            {{ mensaje }}
          </p>
        }

        <!-- Botón de inicio de sesión -->
        <ion-button
          expand="block"
          type="submit"
          class="login-button"
          [disabled]="cargando">

          {{ cargando ? 'Iniciando sesión...' : 'Iniciar sesión' }}

        </ion-button>

      </form>

      <!-- Enlace a Registro -->
      <p class="register-text">
        ¿No tienes una cuenta?

        <a routerLink="/registro">
          Regístrate
        </a>
      </p>

    </div>

    <p class="footer-text">
      Juega responsablemente
    </p>

  </div>

</ion-content>
