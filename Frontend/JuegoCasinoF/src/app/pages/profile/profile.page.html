<ion-content [fullscreen]="true">

  <div class="profile-container">

    <!-- ============================== -->
    <!-- ENCABEZADO -->
    <!-- ============================== -->

    <header class="profile-header">

      <div class="casino-logo">
        <span class="logo-symbol">♠</span>

        <div>
          <h1>CASINO</h1>
          <span class="logo-subtitle">ROYAL</span>
        </div>
      </div>

      <span class="page-title">
        PERFIL DE USUARIO
      </span>

    </header>


    <!-- ============================== -->
    <!-- PERFIL -->
    <!-- ============================== -->

    <main class="profile-content">

      <section class="profile-card">

        <div class="profile-avatar">
          ♟
        </div>

        <h2>Jugador</h2>

        <p class="username">
          Usuario del casino
        </p>

        <div class="profile-line"></div>

        <p class="member-text">
          Miembro de Casino Royal
        </p>

      </section>


      <!-- ============================== -->
      <!-- ESTADÍSTICAS -->
      <!-- ============================== -->

      <section class="stats-container">

        <div class="stat-card">

          <span class="stat-icon">
            🪙
          </span>

          <strong>
            500
          </strong>

          <span class="stat-label">
            FICHAS
          </span>

        </div>


        <div class="stat-card">

          <span class="stat-icon">
            🏆
          </span>

          <strong>
            0
          </strong>

          <span class="stat-label">
            VICTORIAS
          </span>

        </div>


        <div class="stat-card">

          <span class="stat-icon">
            🎰
          </span>

          <strong>
            0
          </strong>

          <span class="stat-label">
            PARTIDAS
          </span>

        </div>

      </section>


      <!-- ============================== -->
      <!-- OPCIONES -->
      <!-- ============================== -->

      <section class="options-card">

        <button class="profile-option">

          <span class="option-icon">
            ⚙
          </span>

          <span class="option-text">
            Configuración de cuenta
          </span>

          <span class="arrow">
            ›
          </span>

        </button>


        <button class="profile-option">

          <span class="option-icon">
            🏆
          </span>

          <span class="option-text">
            Historial de partidas
          </span>

          <span class="arrow">
            ›
          </span>

        </button>


        <button class="profile-option logout">

          <span class="option-icon">
            🚪
          </span>

          <span class="option-text">
            Cerrar sesión
          </span>

          <span class="arrow">
            ›
          </span>

        </button>

      </section>

    </main>


    <!-- ============================== -->
    <!-- PIE -->
    <!-- ============================== -->

    <footer class="profile-footer">

      <span>
        Juega responsablemente
      </span>

    </footer>

  </div>

</ion-content>
