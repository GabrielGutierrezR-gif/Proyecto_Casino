
<ion-content [fullscreen]="true">

  <div class="registro-container">

    <div class="registro-header">
      <h1>Casino</h1>
      <p>¡Crea tu cuenta y empieza a jugar!</p>
    </div>

    <div class="registro-card">

      <h2>Crea tu cuenta</h2>

      <p class="subtitle">
        Regístrate para comenzar a disfrutar
      </p>

      <form (ngSubmit)="registrar()">

        <!-- Nombre de usuario -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="person-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="nombreUsuario"
            type="text"
            placeholder="Nombre de usuario"
            autocomplete="username"
            [(ngModel)]="nombreUsuario"
            required>
          </ion-input>
        </ion-item>

        <!-- Correo electrónico -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="mail-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="correo"
            type="email"
            placeholder="Correo electrónico"
            autocomplete="email"
            [(ngModel)]="correo"
            required>
          </ion-input>
        </ion-item>

        <!-- Contraseña -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="lock-closed-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="new-password"
            [(ngModel)]="password"
            required>
          </ion-input>
        </ion-item>

        <!-- Confirmar contraseña -->
        <ion-item lines="none" class="input-item">
          <ion-icon
            name="lock-closed-outline"
            slot="start">
          </ion-icon>

          <ion-input
            name="confirmarPassword"
            type="password"
            placeholder="Confirmar contraseña"
            autocomplete="new-password"
            [(ngModel)]="confirmarPassword"
            required>
          </ion-input>
        </ion-item>

        <!-- Mensajes de validación y respuesta del servidor -->

@if (mensaje) {
  <p [style.color]="esError ? '#ff7070' : '#f5c451'">
    {{ mensaje }}
  </p>
}


        <!-- Botón de registro -->
        <ion-button
          expand="block"
          type="submit"
          class="registro-button"
          [disabled]="cargando">

          {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}

        </ion-button>

      </form>

      <!-- Enlace para iniciar sesión -->
      <p class="login-text">
        ¿Ya tienes una cuenta?

        <a routerLink="/login">
          Iniciar sesión
        </a>
      </p>

    </div>

    <p class="footer-text">
      Juega responsablemente
    </p>

  </div>

</ion-content>
